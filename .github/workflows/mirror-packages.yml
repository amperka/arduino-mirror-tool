---
name: mirror-packages

on:
  schedule:
    # Weekly, Sunday 03:17 UTC (avoid the :00 storm).
    - cron: "17 3 * * 0"
  workflow_dispatch: {} # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: mirror-packages-publication

env:
  TARGET_KIND: "s3"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked

      - name: Publish packages
        env:
          MIRROR_HOST: "${{ vars.MIRROR_HOST }}"
          ARCHITECTURES: "${{ vars.ARCHITECTURES }}"
          PACKAGES: "${{ vars.PACKAGES }}"
          PACKAGES_LOCAL_INDEX: "data/package_index_overlay.json"
          PINNED_TOOLS: ${{ vars.PINNED_TOOLS }}
          TARGET_BUCKET: "${{ secrets.TARGET_BUCKET }}"
          TARGET_ENDPOINT: "${{ secrets.TARGET_ENDPOINT }}"
          TARGET_PREFIX: ""
          AWS_ACCESS_KEY_ID: "${{ secrets.TARGET_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.TARGET_SECRET_ACCESS_KEY }}"
        run: uv run arduino-mirror packages

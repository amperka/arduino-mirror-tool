---
name: mirror-libraries

on:
  schedule:
    # Weekly, Sunday 04:17 UTC (avoid the :00 storm).
    - cron: "17 4 * * 0"
  workflow_dispatch: {} # manual run from the Actions tab

permissions:
  contents: read
  id-token: write

concurrency:
  group: mirror-libraries-publication

env:
  MIRROR_HOST: "https://arduino-downloads.amperka.ru"
  ARCHITECTURES: "avr,samd,sam,megaavr,mbed_nano,mbed_rp2040"
  PACKAGES: "arduino,builtin"
  TARGET_KIND: "gcs"
  TARGET_BUCKET: "amperka-arduino-downloads"
  TARGET_PREFIX: ""

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}"
          create_credentials_file: true
          export_environment_variables: true

      - name: Publish libraries
        run: uv run arduino-mirror libraries

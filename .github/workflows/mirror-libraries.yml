---
name: mirror-libraries

on:
  schedule:
    # Weekly, Sunday 04:17 UTC (avoid the :00 storm).
    - cron: "17 4 * * 0"
  workflow_dispatch: {} # manual run from the Actions tab

permissions:
  contents: read
  id-token: write

concurrency:
  group: mirror-libraries-publication

env:
  TARGET_KIND: "gcs"
  TARGET_BUCKET: "amperka-arduino-downloads"
  TARGET_PREFIX: ""

jobs:
  mirror:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Install the project
        run: uv sync --locked

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}"
          create_credentials_file: true
          export_environment_variables: true

      - name: Publish libraries
        env:
          MIRROR_HOST: "${{ vars.MIRROR_HOST }}"
        run: uv run arduino-mirror libraries

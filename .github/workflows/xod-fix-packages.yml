---
name: xod-fix-packages

on:
  schedule:
    # Weekly, Sunday 06:17 UTC (avoid the :00 storm).
    - cron: "17 6 * * 0"
  workflow_dispatch: {} # Manual run from the Actions tab

permissions:
  contents: read
  id-token: write

concurrency:
  group: xod-fix-publication

env:
  TARGET_BUCKET: "amperka-arduino-downloads"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Build XOD fix packages
        env:
          MIRROR_HOST: "${{ vars.MIRROR_HOST }}"
        run: scripts/build-xod-fix-packages.sh

      - name: Validate archives
        run: |
          tar -tzf dist/xod-packages-linux-x86_64.tar.gz >/dev/null
          unzip -Z1 dist/xod-packages-windows-x86_64.zip >/dev/null
          tar -tzf dist/xod-packages-macos-x86_64.tar.gz >/dev/null

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}"
          create_credentials_file: true
          export_environment_variables: true

      - name: Synchronize XOD fix packages
        env:
          RCLONE_CONFIG_STORAGE_TYPE: "google cloud storage"
          RCLONE_CONFIG_STORAGE_ENV_AUTH: "true"
          RCLONE_CONFIG_STORAGE_BUCKET_POLICY_ONLY: "true"
          RCLONE_CONFIG_STORAGE_NO_CHECK_BUCKET: "true"
        run: rclone sync dist "storage:${TARGET_BUCKET}/xod-fix/"
